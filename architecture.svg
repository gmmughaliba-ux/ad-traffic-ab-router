<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="700" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Ad Traffic A/B Router: Architecture</text>

  <!-- Ad click -->
  <rect x="330" y="56" width="300" height="56" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="480" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Paid ad click</text>
  <text x="480" y="100" text-anchor="middle" font-size="12" fill="#475569">UTM / gclid / fbclid in the URL</text>
  <line x1="480" y1="112" x2="480" y2="148" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Router -->
  <rect x="215" y="150" width="530" height="215" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Traffic router (Cloudflare Worker)</text>
  <text x="235" y="206" font-size="13" fill="#0f172a"><tspan font-weight="bold">1. Bot?</tspan> User-Agent pattern match</text>
  <text x="255" y="224" font-size="12" fill="#475569">→ send to Site A, not counted, no cookie</text>
  <text x="235" y="252" font-size="13" fill="#0f172a"><tspan font-weight="bold">2. Returning visitor?</tspan> sticky cookie (30 days)</text>
  <text x="255" y="270" font-size="12" fill="#475569">→ same site again, if that site is still live</text>
  <text x="235" y="298" font-size="13" fill="#0f172a"><tspan font-weight="bold">3. New visitor, or old site is down</tspan></text>
  <text x="255" y="316" font-size="12" fill="#475569">→ random pick among live sites (~50/50), set cookie</text>
  <text x="235" y="344" font-size="13" fill="#0f172a"><tspan font-weight="bold">4. Both sites down</tspan> → fail safe to Site A</text>

  <!-- KV -->
  <rect x="25" y="165" width="160" height="170" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="105" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#713f12">KV store</text>
  <text x="105" y="216" text-anchor="middle" font-size="12" fill="#0f172a">Visit counters</text>
  <text x="105" y="232" text-anchor="middle" font-size="11" fill="#475569">per site, per device</text>
  <text x="105" y="262" text-anchor="middle" font-size="12" fill="#0f172a">Kill-switch flags</text>
  <text x="105" y="278" text-anchor="middle" font-size="11" fill="#475569">which sites are down</text>
  <text x="105" y="308" text-anchor="middle" font-size="11" fill="#475569">window start time</text>
  <line x1="215" y1="250" x2="185" y2="250" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="200" y="242" text-anchor="middle" font-size="10" fill="#475569">r/w</text>

  <!-- Admin endpoints -->
  <rect x="775" y="165" width="160" height="170" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="855" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Admin endpoints</text>
  <text x="855" y="210" text-anchor="middle" font-size="11" fill="#475569">(secret key required)</text>
  <text x="855" y="238" text-anchor="middle" font-size="12" fill="#0f172a">/toggle</text>
  <text x="855" y="254" text-anchor="middle" font-size="11" fill="#475569">manual kill-switch</text>
  <text x="855" y="280" text-anchor="middle" font-size="12" fill="#0f172a">/stats</text>
  <text x="855" y="296" text-anchor="middle" font-size="11" fill="#475569">JSON for the dashboard</text>
  <text x="855" y="320" text-anchor="middle" font-size="12" fill="#0f172a">/reset</text>
  <line x1="745" y1="250" x2="775" y2="250" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Redirects -->
  <line x1="390" y1="365" x2="250" y2="438" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="365" x2="500" y2="438" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="185" y="398" text-anchor="middle" font-size="11" fill="#475569">302 redirect</text>
  <text x="185" y="412" text-anchor="middle" font-size="11" fill="#475569">+ original params</text>
  <text x="185" y="426" text-anchor="middle" font-size="11" fill="#475569">+ variant, device</text>

  <!-- Sites -->
  <rect x="120" y="440" width="230" height="80" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="235" y="474" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Site A</text>
  <text x="235" y="496" text-anchor="middle" font-size="12" fill="#475569">landing and ticket checkout</text>
  <rect x="385" y="440" width="230" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="500" y="474" text-anchor="middle" font-size="16" font-weight="bold" fill="#4c1d95">Site B</text>
  <text x="500" y="496" text-anchor="middle" font-size="12" fill="#475569">landing and ticket checkout</text>

  <!-- Dashboard -->
  <rect x="690" y="440" width="245" height="130" rx="8" fill="#f8fafc" stroke="#0f172a"/>
  <text x="812" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Health and split dashboard</text>
  <text x="812" y="492" text-anchor="middle" font-size="12" fill="#0f172a">Split vs target (±3% band)</text>
  <text x="812" y="510" text-anchor="middle" font-size="12" fill="#0f172a">Mobile / tablet / desktop mix</text>
  <text x="812" y="528" text-anchor="middle" font-size="12" fill="#0f172a">Data freshness, sample size</text>
  <text x="812" y="546" text-anchor="middle" font-size="12" fill="#0f172a">Auto-refresh every 60 s</text>
  <line x1="855" y1="335" x2="855" y2="438" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="900" y="392" text-anchor="middle" font-size="11" fill="#475569">reads /stats</text>

  <!-- Attribution note -->
  <rect x="120" y="560" width="495" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5,4"/>
  <text x="367" y="580" text-anchor="middle" font-size="12" fill="#0f172a">Sales are compared per site using the variant tag passed in the URL</text>
  <text x="367" y="597" text-anchor="middle" font-size="12" fill="#0f172a">(attribution happens in the sites' analytics, not in the router)</text>

  <!-- Footer note -->
  <text x="480" y="650" text-anchor="middle" font-size="12" fill="#475569">The kill-switch is manual (/toggle). The router has no automatic uptime check.</text>
  <text x="480" y="670" text-anchor="middle" font-size="12" fill="#475569">The dashboard "health" refers to split balance, data freshness, and sample size.</text>
</svg>
